name: Competition CI

on:
  pull_request:
  push:
    branches: [main, agent/competition-ready-caremate]

concurrency:
  group: competition-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caremate/api typecheck
      - run: pnpm --filter @caremate/api test
      - run: pnpm --filter @caremate/api test:integration
      - run: pnpm --filter @caremate/api build

  mobile:
    name: Flutter checks and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:3000/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: caremate-competition-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
